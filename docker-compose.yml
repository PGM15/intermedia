services:
  mongo:
    image: mongo:7
    container_name: intermedia-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  api:
    build: .
    container_name: intermedia-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/intermedia
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
